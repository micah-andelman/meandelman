<script>
  try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  // Easter egg: finding this page counts toward the list behind the egg icon.

<link rel="stylesheet" href="/styles.css">
<style>
  .oc { min-height: 100svh; display: flex; flex-direction: column; justify-content: center; padding: 48px var(--gutter); }
  .oc .code { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(120px, 30vw, 360px); line-height: .8; letter-spacing: -.02em; color: var(--ink); }
  .oc .brk { display: flex; align-items: center; margin: clamp(20px, 4vh, 40px) 0; }
  .oc .brk i { flex: 1; height: 3px; background: var(--copper); }
  .oc .brk svg { flex: none; overflow: visible; }
  .oc .t { stroke: var(--copper); stroke-width: 3; stroke-linecap: round; fill: none; }
  .oc .end { fill: var(--copper); }
  .oc .spark { stroke: var(--copper); stroke-width: 2; stroke-linecap: round; opacity: 0; animation: spark 1.6s infinite; }
  .oc .spark:nth-of-type(2n) { animation-delay: .35s; }
  .oc .spark:nth-of-type(3n) { animation-delay: .8s; }
  .oc .gap { fill: var(--ink-3); font: 500 14px var(--text); }
  @keyframes spark { 0%, 62% { opacity: 0; } 64% { opacity: 1; } 70% { opacity: .2; } 72% { opacity: 1; } 80%, 100% { opacity: 0; } }
  .oc h1 { margin: 0 0 8px; font-family: var(--display); font-weight: 700; font-size: clamp(36px, 6vw, 64px); line-height: 1; }
  .oc p { margin: 0 0 24px; color: var(--ink-2); max-width: 46ch; }
  .oc a.home { color: var(--mask); font-size: 19px; }
  @media (prefers-reduced-motion: reduce) { .oc .spark { animation: none; opacity: .8; } }
</style>
